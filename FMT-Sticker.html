<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMC FMT Sticker — 164 × 103 mm</title>
<style>
  :root{
    --ink:#000;
    --w:103mm;   /* width  */
    --h:164mm;   /* height */
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:#e9e9ec;
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  /* on-screen toolbar — hidden when printing */
  .toolbar{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    padding:14px;
    background:#fff;
    border-bottom:1px solid #ccc;
    position:sticky;
    top:0;
    z-index:10;
  }
  .toolbar button{
    font:600 14px/1 Arial, sans-serif;
    padding:10px 18px;
    border:1px solid #000;
    background:#000;
    color:#fff;
    border-radius:6px;
    cursor:pointer;
  }
  .toolbar button.secondary{
    background:#fff;
    color:#000;
  }
  .toolbar .hint{font-size:12px;color:#666;}

  .stage{
    display:flex;
    justify-content:center;
    padding:24px;
  }

  /* THE STICKER ------------------------------------------------ */
  .sticker{
    width:var(--w);
    height:var(--h);
    background:#fff;
    border:1px solid #000;
    padding:9mm 8mm;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo{
    width:46mm;
    margin-top:2mm;
    margin-bottom:2mm;
  }
  .logo svg{width:100%;height:auto;display:block;}

  .label-fmt{
    font-size:7mm;
    font-weight:700;
    letter-spacing:0.18em;
    margin-top:1mm;
    margin-bottom:1mm;
  }
  .sub{
    font-size:3.1mm;
    letter-spacing:0.22em;
    text-transform:uppercase;
    text-align:center;
    margin-bottom:4mm;
  }

  .rule{
    width:100%;
    border:none;
    border-top:1.2px solid #000;
    margin:3mm 0;
  }

  .fields{
    width:100%;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6mm;
  }
  .field label{
    display:block;
    font-size:3mm;
    font-weight:700;
    letter-spacing:0.16em;
    text-transform:uppercase;
    margin-bottom:1.5mm;
  }
  .field input{
    width:100%;
    border:none;
    border-bottom:1.4px solid #000;
    font-size:5.5mm;
    font-weight:600;
    padding:1mm 0.5mm;
    color:#000;
    background:transparent;
    font-family:inherit;
  }
  .field input:focus{outline:none;background:#f3f3f3;}
  .field input::placeholder{color:#bbb;font-weight:400;}

  .footer{
    width:100%;
    text-align:center;
    font-size:2.6mm;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-top:3mm;
    color:#000;
  }

  /* PRINT ------------------------------------------------------ */
  @page{
    size:103mm 164mm;   /* width height */
    margin:0;
  }
  @media print{
    html,body{background:#fff;}
    .toolbar{display:none !important;}
    .stage{padding:0;}
    .sticker{
      border:none;
      width:103mm;
      height:164mm;
      page-break-after:avoid;
    }
    .field input:focus{background:transparent;}
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button onclick="window.print()">Print / Save as PDF</button>
    <button class="secondary" onclick="clearFields()">Clear fields</button>
    <span class="hint">Type into the fields, then Print → “Save as PDF”. Paper size: 103 × 164&nbsp;mm.</span>
  </div>

      <div class="label-fmt">FMT</div>
      <div class="sub">Faecal Microbiota Transplant&nbsp;·&nbsp;Enema</div>

      <hr class="rule">

      <div class="fields">
        <div class="field">
          <label for="patient">Patient Name</label>
          <input id="patient" type="text" placeholder="" autocomplete="off">
        </div>
        <div class="field">
          <label for="donor">Donor Number</label>
          <input id="donor" type="text" placeholder="" autocomplete="off">
        </div>
        <div class="field">
          <label for="expiry">Expiry Date</label>
          <input id="expiry" type="text" placeholder="DD / MM / YYYY" autocomplete="off">
        </div>
      </div>

      <hr class="rule">
      <div class="footer">Store frozen · Keep upright · For single patient use only</div>

    </div>
  </div>

  <script>
    // keep typed values in the printed output
    document.querySelectorAll('.field input').forEach(function(el){
      el.addEventListener('input', function(){
        this.setAttribute('value', this.value);
      });
    });
    function clearFields(){
      document.querySelectorAll('.field input').forEach(function(el){
        el.value=''; el.setAttribute('value','');
      });
      document.getElementById('patient').focus();
    }
  </script>

</body>
</html>

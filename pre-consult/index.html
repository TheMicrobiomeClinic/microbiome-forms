/* drifting cloud wisps over the sky */
.side-blobs{position:absolute;left:0;right:0;top:0;height:78%;overflow:hidden;pointer-events:none}
.side-blobs span{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.5), rgba(255,255,255,0) 68%);filter:blur(8px);animation:sail linear infinite;will-change:transform}
.side-blobs span:nth-child(1){width:300px;height:120px;top:14%;animation-duration:75s;animation-delay:-10s;opacity:.5}
.side-blobs span:nth-child(2){width:180px;height:70px;top:34%;animation-duration:95s;animation-delay:-45s;opacity:.4}
.side-blobs span:nth-child(3){width:120px;height:50px;top:52%;animation-duration:64s;animation-delay:-25s;opacity:.35}
.side-blobs span:nth-child(4){width:230px;height:90px;top:64%;animation-duration:110s;animation-delay:-70s;opacity:.3}
.side-blobs span:nth-child(5){width:90px;height:40px;top:24%;animation-duration:58s;animation-delay:-35s;opacity:.3}
@keyframes sail{0%{transform:translateX(-40%)}100%{transform:translateX(760%)}}
/* legibility scrims */
.side::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom, rgba(20,60,95,.34) 0%, rgba(20,60,95,0) 26%, rgba(0,0,0,0) 58%, rgba(18,52,30,.48) 100%)}
.side-logo{position:absolute;top:44px;left:48px;width:130px;opacity:.97;z-index:2;filter:drop-shadow(0 1px 6px rgba(0,0,0,.28))}
.side-logo svg{width:100%;height:auto}
.side-logo svg g{fill:#FFFEF0}
.side-fact{position:absolute;left:48px;right:48px;bottom:44px;color:#FFFEF0;z-index:2;transition:opacity .5s var(--ease);text-shadow:0 1px 10px rgba(0,0,0,.4)}
.side-fact h4{font-family:var(--heading);font-weight:600;font-size:15px;letter-spacing:.02em;margin-bottom:8px}
.side-fact p{font-family:var(--heading);font-weight:400;font-size:14px;line-height:1.55;max-width:420px;opacity:.92}
@media (prefers-reduced-motion:reduce){.side-img{animation:none}.side-blobs{display:none}}
@media(min-width:920px){.side{display:block}}

.main{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;gap:16px}
.topbar .wordmark{width:96px;flex:none}
.topbar .wordmark svg{width:100%;height:auto;display:block}
@media(min-width:920px){.topbar{padding:28px 48px}}

/* progress ring */
.progress-pill{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line-soft);border-radius:999px;padding:6px 12px;box-shadow:0 2px 10px rgba(93,90,73,.06)}
.progress-pill .pct{font-family:var(--heading);font-size:13px;font-weight:500;color:var(--brown);min-width:32px;text-align:right}
.ring{width:22px;height:22px;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line-soft);stroke-width:3}
.ring .bar{fill:none;stroke:var(--peach);stroke-width:3;stroke-linecap:round;stroke-dasharray:56.5;transition:stroke-dashoffset .5s var(--ease)}

/* step area */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 24px 140px;overflow-y:auto}
.step{width:100%;max-width:560px;opacity:0;transform:translateY(14px);animation:enter .45s var(--ease) forwards}
@keyframes enter{to{opacity:1;transform:none}}
.step.leaving{animation:leave .22s ease forwards}
@keyframes leave{to{opacity:0;transform:translateY(-10px)}}

.kicker{display:inline-block;font-family:var(--heading);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brown);background:var(--peach-faint);border:1px solid var(--peach-soft);border-radius:999px;padding:5px 12px;margin-bottom:18px}
h1{font-family:var(--heading);font-weight:600;font-size:clamp(24px,4.6vw,32px);line-height:1.2;text-align:center;color:var(--ink);margin-bottom:14px}
.sub{font-family:var(--heading);font-weight:400;font-size:15px;line-height:1.55;color:var(--grey);text-align:center;max-width:460px;margin:0 auto 30px}
.step-head{text-align:center}

/* option cards */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;background:var(--white);border:1.5px solid var(--line-soft);border-radius:14px;padding:15px 16px;cursor:pointer;font-family:var(--heading);font-size:15.5px;font-weight:500;color:var(--ink);transition:border-color .15s,background .15s,transform .08s;user-select:none}
.opt:active{transform:scale(.985)}
.opt:hover{border-color:var(--peach)}
.opt .box{flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--line);border-radius:50%;position:relative;transition:all .15s}
.opt.sq .box{border-radius:6px}
.opt.selected{border-color:var(--peach);background:var(--peach-faint)}
.opt.selected .box{background:var(--peach);border-color:var(--peach)}
.opt.selected .box::after{content:"";position:absolute;inset:0;background:center/11px no-repeat url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%235D5A49" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>')}
.opt small{display:block;font-weight:400;font-size:13px;color:var(--grey);margin-top:3px;line-height:1.45}
.opt .txt{flex:1}

/* chip grid */
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{font-family:var(--heading);font-size:14px;font-weight:500;color:var(--ink);background:var(--white);border:1.5px solid var(--line-soft);border-radius:999px;padding:9px 15px;cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--peach)}
.chip.selected{background:var(--peach);border-color:var(--peach);color:var(--brown-deep)}

/* inputs */
textarea,input[type=text],input[type=email],input[type=tel],input[type=date],select{width:100%;font-family:var(--body);font-size:17px;color:var(--ink);background:var(--white);border:1.5px solid var(--line-soft);border-radius:14px;padding:14px 16px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
textarea:focus,input:focus,select:focus{border-color:var(--peach)}
textarea{min-height:130px;resize:vertical;line-height:1.55}
textarea.tall{min-height:170px}
::placeholder{color:#B8B5A6;font-style:italic}
label.f{display:block;font-family:var(--heading);font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--brown);margin:0 0 7px 2px}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
select{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%235D5A49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');background-repeat:no-repeat;background-position:right 14px center;background-size:16px;padding-right:44px}
.hint{font-family:var(--heading);font-size:13px;color:var(--grey);line-height:1.5;margin:8px 2px 0;text-align:center}
.hint.left{text-align:left}

/* 0-10 scale */
.scale-row{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin-top:6px}
.scale-btn{aspect-ratio:1/1.15;display:flex;align-items:center;justify-content:center;font-family:var(--heading);font-weight:600;font-size:15px;color:var(--ink);background:var(--white);border:1.5px solid var(--line-soft);border-radius:12px;cursor:pointer;transition:all .12s;user-select:none}
.scale-btn:hover{border-color:var(--peach)}
.scale-btn.selected{background:var(--peach);border-color:var(--peach);color:var(--brown-deep);transform:scale(1.06)}
.anchors{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--heading);font-size:12.5px;color:var(--grey)}
.anchors span{max-width:44%}
.anchors span:last-child{text-align:right}
@media(max-width:420px){.scale-row{gap:4px}.scale-btn{font-size:13px;border-radius:9px}}

/* nav bar */
.navbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--cream) 60%,transparent);z-index:10;pointer-events:none}
.navbar .inner{display:flex;gap:12px;width:100%;max-width:560px;pointer-events:auto}
@media(min-width:920px){.navbar{left:44%}}
.btn{font-family:var(--heading);font-weight:600;font-size:15.5px;border:none;border-radius:999px;padding:16px 28px;cursor:pointer;transition:all .18s;letter-spacing:.01em}
.btn:active{transform:scale(.98)}
.btn-back{background:var(--white);color:var(--brown);border:1.5px solid var(--line-soft);flex:0 0 auto}
.btn-back:hover{border-color:var(--line)}
.btn-next{background:var(--brown);color:var(--cream);flex:1}
.btn-next:hover{background:var(--brown-deep)}
.btn-next:disabled{background:#CFCCBD;color:#FFFDF4;cursor:not-allowed}
.btn-cta{background:var(--brown);color:var(--cream);width:100%;font-size:16px;padding:18px 28px}
.btn-cta:hover{background:var(--brown-deep)}

/* welcome */
.welcome{text-align:center;padding-top:4vh}
.welcome .logo-big{width:170px;margin:0 auto 34px}
.welcome .logo-big svg{width:100%;height:auto}
.welcome h1{font-size:clamp(28px,5.4vw,38px)}
.welcome .sub{font-size:16px;margin-bottom:34px}
.trust{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--heading);font-size:13px;color:var(--grey);margin-top:16px}
.trust svg{width:15px;height:15px;flex:none}

/* consent */
.consent-box{background:var(--white);border:1.5px solid var(--line-soft);border-radius:16px;padding:20px 22px;font-size:15.5px;line-height:1.6;margin-bottom:16px;max-height:300px;overflow-y:auto}
.consent-box strong{font-family:var(--heading);font-size:14px;font-weight:600}
.consent-box p{margin-bottom:10px}
.consent-box p:last-child{margin-bottom:0}

/* loading */
.loadwrap{text-align:center;padding-top:8vh}
.spinner{width:64px;height:64px;margin:0 auto 26px;border-radius:18px;background:var(--peach-faint);display:flex;align-items:center;justify-content:center}
.spinner::after{content:"";width:28px;height:28px;border:3.5px solid var(--peach-soft);border-top-color:var(--brown);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-list{margin:30px auto 0;max-width:340px;text-align:left}
.load-item{display:flex;gap:10px;align-items:center;font-family:var(--heading);font-size:14.5px;color:var(--grey);padding:7px 0;opacity:0;animation:enter .4s var(--ease) forwards}
.load-item svg{width:16px;height:16px;flex:none;stroke:var(--peach);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* done */
.done{text-align:center;padding-top:5vh}
.done .bigtick{width:74px;height:74px;margin:0 auto 28px;border-radius:50%;background:var(--peach);display:flex;align-items:center;justify-content:center}
.done .bigtick svg{width:34px;height:34px;stroke:var(--brown-deep);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.done-card{background:var(--white);border:1.5px solid var(--line-soft);border-radius:18px;padding:26px;margin:30px 0 18px;text-align:left}
.done-card h3{font-family:var(--heading);font-weight:600;font-size:16px;margin-bottom:8px}
.done-card p{font-size:16px;color:var(--ink);line-height:1.6}
.mini-note{font-family:var(--heading);font-size:13px;color:var(--grey);margin-top:14px;line-height:1.5}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.two-col{grid-template-columns:1fr}}
.optional-tag{font-weight:400;color:var(--grey);font-size:12px;letter-spacing:0;text-transform:none}
.turnstile-wrap{display:flex;justify-content:center;margin-top:18px;min-height:70px}
.turnstile-note{font-family:var(--heading);font-size:12.5px;color:var(--grey);text-align:center;margin-top:8px}
.fmt-info{background:#FFF6EC;border:1.5px solid #FFD9B3;border-radius:12px;padding:15px 17px;margin-bottom:18px}
.fmt-info h4{font-family:var(--heading);font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--brown);margin-bottom:7px}
.fmt-info p{font-size:15.5px;line-height:1.55;margin-bottom:8px}
.fmt-info p:last-child{margin-bottom:0}
.dob-row{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
.dob-row input{text-align:center}
.add-btn{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--heading);font-size:14px;font-weight:600;color:var(--brown);background:var(--peach-faint);border:1.5px dashed var(--peach-soft);border-radius:12px;padding:13px 18px;cursor:pointer;transition:all .15s;width:100%;user-select:none}
.add-btn:hover{border-color:var(--peach);background:#FFE9D2}
.add-btn:active{transform:scale(.99)}
.remove-link{font-family:var(--heading);font-size:13px;font-weight:500;color:var(--grey);cursor:pointer}
.remove-link:hover{color:#C0553D}
</style>
</head>
<body>

  <!-- decorative side panel (desktop) -->
  <aside class="side">

</div>

<script>
/* ============ setup ============ */
const logoSVG = document.getElementById('logoSrc').outerHTML.replace('display:none','').replace('id="logoSrc"','');
document.getElementById('topLogo').innerHTML = logoSVG;
document.getElementById('sideLogo').innerHTML = logoSVG;

const answers = {};
let flow = [];          // active step id list
let stepIdx = 0;
const history = [];

const facts = [
  "Your doctor personally reads every answer you give here — before you walk into your consult.",
  "The clearer your goals, the more precisely your doctor can tailor your consult to you.",
  "Your gut is home to roughly 38 trillion microbes — more cells than the rest of your body.",
  "We pair your answers with your test results to build a personalised run sheet for your doctor.",
  "There are no wrong answers here. The more you share, the more we can help.",
  "Your instincts about your own body matter. We want to hear what you sense is going on.",
  "The scores you give today let us measure your progress over time — objectively.",
];
let factIdx = 0;

/* duration options */
const DUR = ["Less than 1 month","1–3 months","3–6 months","6–12 months","1–2 years","2–5 years","5+ years","As long as I can remember"];

const SCALES = [
  {id:"qol",    q:"Your overall quality of life right now", lo:"Very poor", hi:"Excellent"},
  {id:"sever",  q:"How much are your symptoms impacting daily life?", lo:"Not at all", hi:"Severely"},
  {id:"energy", q:"Your energy levels", lo:"Exhausted", hi:"Full of energy"},
  {id:"digest", q:"Your digestive comfort", lo:"Constant discomfort", hi:"No issues"},
  {id:"sleep",  q:"Your sleep quality", lo:"Very poor", hi:"Excellent"},
  {id:"mood",   q:"Your mood and stress levels", lo:"Struggling", hi:"Calm & positive"},
  {id:"underst",q:"How well do you feel you understand what's going on with your health?", lo:"No idea", hi:"Fully understand"},
  {id:"optim",  q:"How optimistic are you about improving?", lo:"Not at all", hi:"Very optimistic"},
];

/* ============ step definitions ============ */
const steps = {

/* ---- shared entry ---- */
welcome:{
  nav:false, progress:false,
  render:()=>`
    <div class="welcome">
      <div class="logo-big">${logoSVG}</div>
      <h1>Let's prepare for<br>your consult</h1>
      <p class="sub">A few questions before your appointment so your doctor understands exactly what you're feeling, what you want, and what matters most to you. Takes about 5–8 minutes.</p>
      <button class="btn btn-cta" onclick="next()">Begin</button>
      <div class="trust">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8B887A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Private &amp; confidential — read only by your care team
      </div>
    </div>`
},

gate:{
  autoAdvance:true,
  render:()=>stepHead("Is this your first appointment with us?","This helps us ask the right questions.")+
    radios('gate',[["initial","Yes — this is my first appointment"],["followup","No — I'm a returning patient"]])
},

/* ================= INITIAL ================= */
i_found:{
  autoAdvance:true,
  render:()=>stepHead("How did you find The Microbiome Clinic?")+
    radios('found',[["google","Google / online search"],["ai","AI search engine (Claude, ChatGPT, Gemini)"],["instagram","Instagram"],["tiktok","TikTok"],["facebook","Facebook"],["podcast","Podcast, article or news"],["friend_suggested","A friend or family member suggested it"],["friend_treated","A friend or family member has been treated here"],["practitioner","Referred by a GP or practitioner"],["other","Other"]])
},
i_referrer:{
  showIf:()=>["practitioner","friend_suggested","friend_treated"].includes(answers.found),
  render:()=>{
    const isFriend=["friend_suggested","friend_treated"].includes(answers.found);
    return stepHead("Who referred you?","We'd love to thank them — and understand your journey to us.")+
    `<input type="text" id="f1" placeholder="e.g. Dr Jane Smith, or my sister Sarah" value="${esc(answers.referrer)}" oninput="answers.referrer=this.value;check()" ${answers.referrerDecline?'disabled':''}>`+
    (isFriend?`<div class="opts" style="margin-top:12px"><div class="opt sq ${answers.referrerDecline?'selected':''}" onclick="toggleDecline(this)"><span class="box"></span><span class="txt">I'd prefer not to say</span></div></div>`:'');
  },
  valid:()=>answers.referrerDecline===true||nonEmpty(answers.referrer)
},
i_resonate:{
  render:()=>stepHead("What made you book with us?","What resonated with you about our approach? There are no wrong answers.")+
    `<textarea id="f1" placeholder="In your own words…" oninput="answers.resonate=this.value;check()">${esc(answers.resonate)}</textarea>`,
  valid:()=>nonEmpty(answers.resonate)
},
i_indicated:{
  autoAdvance:true,
  render:()=>stepHead("Who first suggested your microbiome might be the issue?")+
    radios('indicated',[["self","I worked it out myself"],["gp","My GP"],["specialist","A specialist"],["naturopath","A naturopath or other practitioner"],["online","My own online research"],["noone","No one yet — I'm exploring"],["optimise","Not an issue — I'm looking to optimise my health"]])
},
i_goals:{
  render:()=>{
    const n = goalCount();
    return stepHead("What are your main goals with coming to the clinic?",
      "Choose up to three, or add your own. <b>"+n+" of 3 selected.</b>")+
    chips('secChips',["More energy","Better digestion","Clearer skin","Weight","Mood & anxiety","Better sleep","Leaky gut","Bad breath","Better immunity","Less brain fog","Understand my results","A clear plan","Hormones / fertility","Reduce medications","Optimise my health"], 3, 'goalCount')+
    `<div style="height:16px"></div>
     <label class="f">OR ADD YOUR OWN GOAL</label>
     <textarea id="f1" style="min-height:80px" placeholder="In your own words…" oninput="answers.secondaryText=this.value;render()">${esc(answers.secondaryText)}</textarea>
     ${n>3?`<p class="hint" style="color:#B04A2B">Please select no more than 3 goals.</p>`:''}`;
  },
  valid:()=>{ const n=goalCount(); return n>=1 && n<=3; }
},
i_concern:{
  render:()=>{
    answers.concerns = (answers.concerns&&answers.concerns.length) ? answers.concerns : [{text:'',dur:'',impact:undefined}];
    const block=(c,i)=>`
      <div class="concern-block" style="${i>0?'margin-top:22px;border-top:1.5px solid var(--line-soft);padding-top:18px':''}">
        ${i>0?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><label class="f" style="margin:0">CONCERN ${i+1}</label><span class="remove-link" onclick="removeConcern(${i})">Remove</span></div>`:''}
        <div class="field"><label class="f">WHAT IS THE CONCERN?</label>
          <textarea style="min-height:90px" placeholder="Describe this symptom or concern…" oninput="setConcern(${i},'text',this.value)">${esc(c.text)}</textarea></div>
        <div class="field"><label class="f">HOW LONG HAVE YOU HAD IT?</label>
          <select onchange="setConcern(${i},'dur',this.value)">
            <option value="" ${!c.dur?'selected':''} disabled>Select duration…</option>
            ${DUR.map(d=>`<option ${c.dur===d?'selected':''}>${d}</option>`).join('')}
          </select></div>
        <div class="field"><label class="f">HOW MUCH DOES IT IMPACT YOUR LIFE?</label>
          ${scaleRowConcern(i)}
          <div class="anchors"><span>0 — No impact</span><span>10 — Severe daily impact</span></div></div>
      </div>`;
    return stepHead("List all your main symptoms and concerns","Add each one separately so your doctor can address them all.")+
      `<div id="concernList">${answers.concerns.map(block).join('')}</div>
       <div class="add-btn" onclick="addConcern()">+ Add another concern</div>`;
  },
  valid:()=>answers.concerns&&answers.concerns.length>0&&answers.concerns.every(c=>nonEmpty(c.text)&&c.dur&&c.impact!==undefined)
},
i_tried:{
  render:()=>stepHead("What have you already tried?","Diets, supplements, medications, tests, other practitioners — the full history helps us avoid repeating what hasn't worked.")+
    `<textarea id="f1" class="tall" placeholder="e.g. low-FODMAP for 3 months, probiotics, saw a naturopath in 2024…" oninput="answers.tried=this.value;check()">${esc(answers.tried)}</textarea>`,
  valid:()=>nonEmpty(answers.tried)
},
i_hope:{
  render:()=>stepHead("What do you hope to get out of this consult?","Select all that apply.")+
    checks('hope',[["diagnosis","A diagnosis — answers on what's going on"],["plan","A clear treatment plan"],["reassure","Reassurance"],["second","A second opinion"],["results","Help interpreting my test results"]])+
    `<div style="height:12px"></div>
     <input type="text" placeholder="Something else? Tell us…" value="${esc(answers.hopeOther)}" oninput="answers.hopeOther=this.value;check()">`,

i_learn:{

/* scaling steps generated */
SCALES.forEach((s,i)=>{
  steps['scale_'+s.id] = {
    autoAdvance:true,
    render:()=>stepHead(s.q, `Check-in ${i+1} of ${SCALES.length}`)+
      scaleRow('scale_'+s.id)+
      `<div class="anchors"><span>0 — ${s.lo}</span><span>10 — ${s.hi}</span></div>`,
    valid:()=>answers['scale_'+s.id]!==undefined
  };
});

/* ============ flows ============ */
const SCALE_IDS = SCALES.map(s=>'scale_'+s.id);
const FLOW_INITIAL = ['welcome','gate','i_found','i_referrer','i_resonate','i_indicated','i_goals','i_concern','i_tried','i_success','transition','questions','scaleIntro',...SCALE_IDS,'screening','extras','disclaimer','consent','details','loading','done_initial'];
const FLOW_FOLLOWUP = ['welcome','gate','f_since','f_compare','f_changed','f_adherence','f_barriers','f_feeling','f_sense','f_newsym','f_want','f_primary','transition','questions','scaleIntro',...SCALE_IDS,'screening','extras','disclaimer','consent','details','loading','done_followup'];
flow = FLOW_INITIAL; // until gate answered

/* ============ helpers ============ */
function esc(v){return (v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function nonEmpty(v){return v&&v.trim().length>0}
function stepHead(t,s){return `<div class="step-head"><h1>${t}</h1>${s?`<p class="sub">${s}</p>`:'<div style="height:14px"></div>'}</div>`}
function radios(key,items){
  return `<div class="opts">`+items.map(([v,l])=>
    `<div class="opt ${answers[key]===v?'selected':''}" onclick="pickRadio('${key}','${v}',this)"><span class="box"></span><span class="txt">${l}</span></div>`).join('')+`</div>`;
}
function checks(key,items){
  answers[key]=answers[key]||[];
  return `<div class="opts">`+items.map(([v,l])=>
    `<div class="opt sq ${answers[key].includes(v)?'selected':''}" onclick="toggleCheck('${key}','${v}',this)"><span class="box"></span><span class="txt">${l}</span></div>`).join('')+`</div>`;
}
function chips(key,items,max,counterFn){
  answers[key]=answers[key]||[];
  const rerender = max ? 'true' : 'false';
  return `<div class="chips">`+items.map(c=>
    `<span class="chip ${answers[key].includes(c)?'selected':''}" onclick="toggleChipVal('${key}','${c.replace(/'/g,"\\'")}',this,${max||0},${rerender})">${c}</span>`).join('')+`</div>`;
}
/* goals = selected chips + (1 if they typed their own) */
function goalCount(){
  const chipsN = (answers.secChips||[]).length;
  return chipsN + (nonEmpty(answers.secondaryText) ? 1 : 0);
}
function scaleRow(key){
  return `<div class="scale-row">`+Array.from({length:11},(_,n)=>
    `<div class="scale-btn ${answers[key]===n?'selected':''}" onclick="pickScale('${key}',${n},this)">${n}</div>`).join('')+`</div>`;
}
function scaleRowConcern(i){
  return `<div class="scale-row">`+Array.from({length:11},(_,n)=>
    `<div class="scale-btn ${answers.concerns[i].impact===n?'selected':''}" onclick="pickConcernScale(${i},${n},this)">${n}</div>`).join('')+`</div>`;
}
function toggleDecline(el){ answers.referrerDecline=!answers.referrerDecline; if(answers.referrerDecline) answers.referrer=''; render(); }
function setConcern(i,field,val){ answers.concerns[i][field]=val; check(); }
function pickConcernScale(i,n,el){ answers.concerns[i].impact=n; el.parentElement.querySelectorAll('.scale-btn').forEach(b=>b.classList.remove('selected')); el.classList.add('selected'); check(); }
function addConcern(){ answers.concerns.push({text:'',dur:'',impact:undefined}); render(); }
function removeConcern(i){ answers.concerns.splice(i,1); render(); }
function pickRadio(key,val,el){
  answers[key]=val;
  el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  if(key==='gate'){ flow = val==='initial' ? FLOW_INITIAL : FLOW_FOLLOWUP; }
  check();
  const st=steps[flow[stepIdx]];
  // only auto-advance single-question steps
  if(st.autoAdvance && flow[stepIdx] !== 'screening') setTimeout(next, 320);
}
function toggleCheck(key,val,el){
  const a=answers[key]=answers[key]||[];
  const i=a.indexOf(val);
  i>=0?a.splice(i,1):a.push(val);
  el.classList.toggle('selected');
  check();
}
function toggleChipVal(key,val,el,max,rerender){
  const a=answers[key]=answers[key]||[];
  const i=a.indexOf(val);
  if(i>=0){ a.splice(i,1); }
  else {
    if(max && goalCount() >= max){ 
      el.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:220});
      return;
    }
    a.push(val);
  }
  if(rerender){ render(); return; }
  el.classList.toggle('selected');
  check();
}
function pickScale(key,n,el){
  answers[key]=n;
  el.parentElement.querySelectorAll('.scale-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  check();
  const st=steps[flow[stepIdx]];
  if(st.autoAdvance) setTimeout(next, 300);
}
function toggleNewSymExtra(){
  const x=document.getElementById('newSymExtra');
  if(x) x.style.display = nonEmpty(answers.newSym)?'block':'none';
}

/* ============ Turnstile (bot check) ============ */
const TURNSTILE_SITE_KEY = "0x4AAAAAAEAbihqlASLuDAFR";
let turnstileToken = null;
let turnstileWidgetId = null;

function mountTurnstile(){
  const box = document.getElementById('turnstileBox');
  if(!box) return;
  if(!window.turnstile){ setTimeout(mountTurnstile, 300); return; }
  turnstileToken = null;
  turnstileWidgetId = window.turnstile.render(box, {
    sitekey: TURNSTILE_SITE_KEY,
    action: 'pre-consult',
    callback: (t)=>{ turnstileToken = t; check(); },
    'expired-callback': ()=>{ turnstileToken = null; check(); },
    'error-callback': ()=>{ turnstileToken = null; check(); }
  });
  check();
}

/* ============ submission ============ */
const ENDPOINT = "https://rtmbmuzccajxidyhvykc.supabase.co/functions/v1/submit-pre-consult";
/* New Patient form (HealthEngine → Gentu). Initial consults only.
   Deliberately NOT prefilled: appending name/DOB/email to a third-party URL would put
   patient details into server logs, browser history and referrer headers. */
const NEW_PATIENT_FORM_URL =
  "https://healthengine.com.au/new-patient-form/v2/100947?cid=sos:pra:::npf::::jul22";

let submitState = { sending:false, done:false, error:null, result:null };

function buildPayload(){
  const isInitial = answers.gate === 'initial';
  return {
    consult_type: isInitial ? 'initial' : 'followup',

    full_name: answers.name || '',
    date_of_birth: answers.dob || '',
    email: answers.email || '',
    mobile: answers.mobile || '',

    // initial
    found_via: answers.found || null,
    referrer: answers.referrer || null,
    referrer_declined: answers.referrerDecline === true,
    resonated: answers.resonate || null,

    indicated_by: answers.indicated || null,
    already_tried: answers.tried || null,
    success_looks_like: answers.success || null,

    // goals (merged: up to 3, chips + own words)
    primary_goal: answers.primaryGoal || null,
    goal_chips: answers.secChips || [],
    goal_own_words: answers.secondaryText || null,
    secondary_goal_chips: answers.secChips || [],
    secondary_goal_text: answers.secondaryText || null,
    concerns: (answers.concerns || []).map(c => ({ text:c.text, dur:c.dur, impact:c.impact })),

    // follow-up
    since_last_visit: answers.since || null,
    compared_to_last: answers.compare || null,
    what_changed_chips: answers.changedChips || [],
    what_changed_text: answers.changedText || null,
    adherence: answers.adherence || null,
    barriers: answers.barriers || null,
    feeling_now: answers.feeling || null,
    sense_going_on: answers.sense || null,
    new_symptoms: answers.newSym || null,
    new_symptom_duration: answers.newSymDur || null,
    new_symptom_impact: answers.newSymImpact,
    followup_wants: answers.fwant || [],
    followup_wants_other: answers.fwantOther || null,

    // questions
    question_1: answers.q1 || null,
    question_2: answers.q2 || null,
    question_3: answers.q3 || null,

    // scores
    scale_qol: answers.scale_qol,
    scale_severity: answers.scale_sever,
    scale_energy: answers.scale_energy,
    scale_digest: answers.scale_digest,
    scale_sleep: answers.scale_sleep,
    scale_mood: answers.scale_mood,
    scale_understanding: answers.scale_underst,
    scale_optimism: answers.scale_optim,

    pregnancy_status: answers.pregnancy || null,
    fmt_interest: answers.fmt_interest || null,

    anything_else: answers.extra || null,
    prefer_not_discuss: answers.avoid || null,

    consent_given: answers.consent === true,
    disclaimer_accepted: answers.disclaimer === true,
    turnstile_token: turnstileToken,
    website: ''   // honeypot — must stay empty
  };
}

async function submitForm(){
  if(submitState.sending || submitState.done) return;
  submitState.sending = true; submitState.error = null;
  const started = Date.now();
  try{
    const res = await fetch(ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(buildPayload())
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok) throw new Error(data.error || ('HTTP '+res.status));
    submitState.result = data;
    submitState.done = true;
  }catch(err){
    console.error('submit failed', err);
    submitState.error = err.message || 'Network error';
  }finally{
    submitState.sending = false;
    // let the loading animation breathe for at least 2.2s
    const wait = Math.max(0, 2200 - (Date.now()-started));
    setTimeout(()=>{
      if(flow[stepIdx] !== 'loading') return;
      if(submitState.done) next();
      else renderSubmitError();
    }, wait);
  }
}

function renderSubmitError(){
  stage.innerHTML = `<div class="step"><div class="done" style="padding-top:6vh">
    <div class="bigtick" style="background:#FDE7E0"><svg viewBox="0 0 24 24" stroke="#C0553D"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></div>
    <h1>We couldn't send your answers</h1>
    <p class="sub">Your responses are still here — nothing is lost. Please check your connection and try again.</p>
    <button class="btn btn-cta" onclick="retrySubmit()">Try again</button>
    <p class="mini-note">Still not working? Call us on 03 9007 2630 and we'll take your answers over the phone.</p>
  </div></div>`;
  navbar.style.display='none';
}
function retrySubmit(){ submitState.error=null; render(); }

/* ---- Date of birth: entered DD / MM / YYYY, stored as ISO ---- */
function setDob(field, el){
  el.value = el.value.replace(/\D/g,'');
  answers[field] = el.value;
  const d = answers.dobD, m = answers.dobM, y = answers.dobY;
  answers.dob = '';
  if(d && m && y && y.length === 4){
    const dd = parseInt(d,10), mm = parseInt(m,10), yy = parseInt(y,10);
    const dt = new Date(yy, mm-1, dd);
    const now = new Date();
    if(dt.getFullYear()===yy && dt.getMonth()===mm-1 && dt.getDate()===dd
       && yy >= 1900 && dt <= now){
      answers.dob = `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    }
  }
  // auto-jump to the next box
  if(el.value.length === parseInt(el.getAttribute('maxlength'),10)){
    const nx = el.parentElement.querySelector('input:placeholder-shown');
    if(nx && nx !== el) nx.focus();
  }
  check();
  const hint = el.closest('.field').querySelector('.hint');
  if(hint) hint.remove();
  if(d||m||y){
    const p = document.createElement('p');
    p.className = 'hint left';
    if(answers.dob){ p.style.color = '#5D5A49'; p.textContent = dobPretty(); }
    else { p.style.color = '#B04A2B'; p.textContent = 'Please enter a valid date as DD / MM / YYYY.'; }
    el.closest('.field').appendChild(p);
  }
}
function dobPretty(){
  if(!answers.dob) return '';
  const [y,m,d] = answers.dob.split('-');
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)-1]} ${y}`;
}

/* Initial consults: hand off to the New Patient form (HealthEngine → Gentu). */
function goToNewPatientForm(){
  if(!NEW_PATIENT_FORM_URL){
    alert("The New Patient form link isn't set yet.\n\nYour answers HAVE been saved successfully — please call us on 03 9007 2630.");
    return;
  }
  window.location.href = NEW_PATIENT_FORM_URL;
}

/* ============ engine ============ */
const stage=document.getElementById('stage');
const navbar=document.getElementById('navbar');
const btnNext=document.getElementById('btnNext');
const btnBack=document.getElementById('btnBack');
const pill=document.getElementById('progressPill');

function currentStep(){return steps[flow[stepIdx]]}
function visibleFlow(){return flow.filter(id=>{const s=steps[id];return !s.showIf||s.showIf()})}

function render(){
  const id=flow[stepIdx], st=steps[id];
  stage.innerHTML=`<div class="step">${st.render()}</div>`;
  stage.scrollTop=0; window.scrollTo(0,0);
  navbar.style.display = st.nav===false?'none':'flex';
  btnBack.style.visibility = stepIdx===0?'hidden':'visible';
  // progress
  const show = st.progress!==false && id!=='welcome';
  pill.style.visibility = show?'visible':'hidden';
  if(show){
    const vf=visibleFlow();
    const pos=vf.indexOf(id);
    const pct=Math.max(2,Math.round(pos/(vf.length-2)*100));
    document.getElementById('pctText').textContent=Math.min(pct,100)+'%';
    document.getElementById('ringBar').style.strokeDashoffset = 56.5*(1-Math.min(pct,100)/100);
  }
  if(typeof st.onRender === 'function') st.onRender();
  // side fact rotation
  const ft=document.getElementById('factText');
  if(ft){ft.parentElement.style.opacity=0; setTimeout(()=>{ft.textContent=facts[factIdx++%facts.length];ft.parentElement.style.opacity=1;},350);}
  check();
}
function check(){
  const st=currentStep();
  if(st.valid) btnNext.disabled=!st.valid();
  else btnNext.disabled=false;
}
function next(){
  const el=stage.querySelector('.step');
  if(el) el.classList.add('leaving');
  setTimeout(()=>{
    history.push(stepIdx);
    do{ stepIdx++; } while(stepIdx<flow.length-1 && steps[flow[stepIdx]].showIf && !steps[flow[stepIdx]].showIf());
    render();
  },180);
}
btnNext.addEventListener('click',()=>{ if(!btnNext.disabled) next(); });
btnBack.addEventListener('click',()=>{
  if(!history.length) return;
  stepIdx=history.pop();
  render();
});
render();
</script>
